services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: usql_test
      POSTGRES_USER: usql
      POSTGRES_PASSWORD: usql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usql -d usql_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
